<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Register</title>
<link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="app">
        <div class="hero">
            <div class="logo">
                <img src="./photo/freezy.svg" alt="Logo"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback"></span>
            </div>
            <div class="span">
                <span>J</span><span>O</span><span>I</span><span>N</span>
            </div>
            <p>Create an account to get started</p>
        </div>

        <div class="container">
            <form onsubmit="return false;">
                <h2>REGISTER</h2>

                <div class="input">
                    <input type="text" id="reg-username" required>
                    <label for="reg-username">USERNAME</label>
                </div>

                <div class="input password-wrap">
                    <input type="password" id="reg-password" required>
                    <label for="reg-password">PASSWORD</label>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="input password-wrap">
                    <input type="password" id="reg-confirm-password" required>
                    <label for="reg-confirm-password">CONFIRM PASSWORD</label>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <button class="btn" type="submit">CREATE ACCOUNT</button>

                <div class="divider">or</div>

                <div class="ata">
                    <span>Already have an account?</span>
                    <a href="login.html" id="submit">LOGIN</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./firebaseConfig.js"></script>
    <script type="module" src="./register1.js"></script>
</body>
</html>
