<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Activity Log | Store Room</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Rajdhani:wght@600;700&family=JetBrains+Mono&display=swap" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />

  <!-- Shared light/dark state. This has to come before the stylesheet, and
       before anything has been painted, so the page never flashes the wrong
       theme on its way in. -->
  <script src="./theme.js"></script>

  <link rel="stylesheet" href="../css/history.css" />
</head>
<body>

<div class="app-shell">

  <!-- Side Menu Overlay -->
  <div class="side-menu-overlay" id="side-menu-overlay" onclick="toggleMenu()">
    <aside class="side-menu" id="side-menu" onclick="event.stopPropagation()">
      <div class="side-menu__top">
        <div class="side-menu__brand">
          <div class="side-menu__brand-icon">
            <span class="material-symbols-outlined">analytics</span>
          </div>
          <span class="side-menu__brand-title">Menu</span>
        </div>
        <button class="side-menu__close" type="button" onclick="toggleMenu()" aria-label="Close menu">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <nav class="side-menu__nav">
        <a class="nav-link" href="./main.html">
          <span class="material-symbols-outlined">grid_view</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-link nav-link--active" href="./history.html">
          <span class="material-symbols-outlined filled">analytics</span>
          <span>Activity Log</span>
        </a>
        <a class="nav-link" href="./power.html">
          <span class="material-symbols-outlined">show_chart</span>
          <span>Chart</span>
        </a>
        <a class="nav-link nav-link--logout" href="../login.html" onclick="handleLogout(event)">
          <span class="material-symbols-outlined">logout</span>
          <span>Log Out</span>
        </a>
      </nav>

      <div class="side-menu__footer">
        <div class="side-menu__user">
          <div class="side-menu__avatar">
            <div class="side-menu__avatar-inner">
              <span class="material-symbols-outlined size-sm">person</span>
            </div>
          </div>
          <div>
            <p class="side-menu__user-name">Admin User</p>
            <p class="side-menu__user-mail">admin@storeroom.local</p>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="app-header__bar">
      <button class="app-header__menu-btn" type="button" onclick="toggleMenu()" aria-label="Open menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="theme-toggle">
        <button class="theme-toggle__btn" id="btn-theme-light" type="button" onclick="setTheme('light')" aria-label="Light theme">
          <span class="material-symbols-outlined">light_mode</span>
        </button>
        <button class="theme-toggle__btn is-dark-active" id="btn-theme-dark" type="button" onclick="setTheme('dark')" aria-label="Dark theme">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
      </div>
    </div>
    <div class="app-header__title-wrap">
      <h1 class="app-header__title">Activity Log</h1>
      <p class="app-header__sub">Real-time device events</p>
    </div>
  </header>

  <!-- Main -->
  <main class="app-main">

    <!-- Search + stats card -->
    <section class="glass top-card">
      <div class="search-bar">
        <span class="material-symbols-outlined search-bar__icon">search</span>
        <input type="text" id="log-search" placeholder="Search events..." />
      </div>
      <div class="stats-grid">
        <div class="stat-tile">
          <p class="stat-tile__label">Total</p>
          <p class="stat-tile__value primary" id="stat-total">50</p>
        </div>
        <div class="stat-tile">
          <p class="stat-tile__label">On</p>
          <div class="stat-tile__on-row">
            <span class="status-dot status-dot-pulse"></span>
            <p class="stat-tile__value green" id="stat-on">24</p>
          </div>
        </div>
        <div class="stat-tile">
          <p class="stat-tile__label">Off</p>
          <p class="stat-tile__value secondary" id="stat-off">26</p>
        </div>
      </div>
    </section>

    <!-- Filter chips -->
    <div class="filter-row no-scrollbar">
      <button class="filter-chip is-active" data-filter="all" type="button">All Activity</button>
      <button class="filter-chip" data-filter="Lighting" type="button">
        <span class="filter-chip__dot tertiary"></span> Lighting
      </button>
      <button class="filter-chip" data-filter="Fan" type="button">
        <span class="filter-chip__dot secondary"></span> Fan
      </button>
    </div>

    <!-- Log table -->
    <section class="glass log-card">
      <div class="log-card__scroll no-scrollbar">
        <table class="log-table" id="log-table">
          <thead>
            <tr>
              <th>Event</th>
              <th>Device</th>
              <th class="time-col">Time</th>
              <th class="right">Status</th>
            </tr>
          </thead>
          <tbody id="log-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Scroll-to-top FAB -->
    <button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top">
      <span class="material-symbols-outlined">north</span>
    </button>
  </main>
</div>

<script src="./history.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyuUG7eYY-YAFrTcyH4odbcV0DO-bBtdg",
    authDomain: "my-project-name-7e236.firebaseapp.com",
    databaseURL: "https://my-project-name-7e236-default-rtdb.firebaseio.com",
    projectId: "my-project-name-7e236",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const activityQuery = query(ref(db, "/activity/room1"), limitToLast(60));

  onValue(activityQuery, (snapshot) => {
    const data = snapshot.val();
    const rawLogs = [];
    if (data) {
      Object.keys(data).forEach((key) => {
        const item = data[key];
        if (!item) return;
        let formattedTime = (item.time && typeof item.time === 'string' && item.time.trim()) ? item.time : null;
        if (!formattedTime && item.timestamp) {
          const d = new Date(Number(item.timestamp));
          if (!isNaN(d.getTime())) {
            formattedTime = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          }
        }
        rawLogs.push({
          id: key,
          name: item.name || (item.type === 'Fan' ? 'Fan' : 'Light'),
          type: item.type || (item.name === 'Fan' ? 'Fan' : 'Lighting'),
          status: (item.status || 'OFF').toUpperCase(),
          time: formattedTime || '--:--:--',
          timestamp: Number(item.timestamp) || 0,
          icon: item.icon || (item.type === 'Fan' || item.name === 'Fan' ? 'mode_fan' : 'lightbulb'),
          mode: item.mode || 'Auto'
        });
      });

      // Sort newest to oldest so recent events appear at top
      rawLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      // Filter out duplicate identical records for the same device & state within 8 seconds
      const cleanLogs = [];
      for (let i = 0; i < rawLogs.length; i++) {
        const current = rawLogs[i];
        const prev = cleanLogs[cleanLogs.length - 1]; // Already accepted entry
        if (
          prev &&
          prev.name === current.name &&
          prev.status === current.status &&
          Math.abs((prev.timestamp || 0) - (current.timestamp || 0)) < 8000
        ) {
          // Duplicate operation within 8 seconds: skip it!
          continue;
        }
        cleanLogs.push(current);
      }

      if (window.setActivityData) {
        window.setActivityData(cleanLogs);
      }
    } else {
      if (window.setActivityData) {
        window.setActivityData([]);
      }
    }
  }, (err) => {
    console.error("Error reading activity log from Firebase:", err);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email) {
        const mailEl = document.querySelector(".side-menu__user-mail");
        const nameEl = document.querySelector(".side-menu__user-name");
        if (mailEl) mailEl.textContent = user.email;
        if (nameEl) nameEl.textContent = user.email.split("@")[0].toUpperCase();
      }
    } else {
      signInAnonymously(auth).catch(() => {});
    }
  });

  window.handleLogout = async (e) => {
    if (e) e.preventDefault();
    try {
      await signOut(auth);
    } catch (err) {
      console.warn("Sign out error:", err);
    } finally {
      sessionStorage.clear();
      localStorage.removeItem("user");
      window.location.href = "../login.html";
    }
  };
</script>
</body>
</html>
